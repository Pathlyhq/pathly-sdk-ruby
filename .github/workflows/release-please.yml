# Keeps a "chore(main): release x.y.z" PR up to date (CHANGELOG.md + version).
# Merging it creates the vX.Y.Z tag and the GitHub release, then publishes
# that tag. The publish job lives in this workflow (not on "push: tags")
# because a tag created with GITHUB_TOKEN does not trigger other workflows.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # RubyGems Trusted Publishing (OIDC): no API key secret. On rubygems.org, add
  # Pathlyhq/pathly-sdk-ruby, workflow release-please.yml, environment rubygems
  # as trusted publisher of the "pathly" gem (a pending publisher until the
  # first release creates the gem).
  publish-rubygems:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rspec
      - uses: rubygems/release-gem@v1
        with:
          # release-please already pushed the tag and the GitHub release.
          await-release: false
